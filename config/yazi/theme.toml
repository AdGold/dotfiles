# ~/.config/yazi/theme.toml
# Dracula flavor, installed with: ya pkg add yazi-rs/flavors:dracula

[flavor]
dark  = "dracula"
light = "dracula"

# Dracula's own file colours, plus symlinks (orange) and broken symlinks (red).
[filetype]
rules = [
  { url = "*",  is = "orphan", fg = "#ff5555" },
  { url = "*/", is = "orphan", fg = "#ff5555" },
  { url = "*",  is = "link",   fg = "#ffb86c" },
  { url = "*/", is = "link",   fg = "#ffb86c" },
  { mime = "**/image/*", fg = "#8be9fd" },
  { mime = "**/{audio,video}/*", fg = "#f1fa8c" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff79c6" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#50fa7b" },
  { mime = "vfs/{absent,stale}", fg = "#8998c9" },
  { url = "*", fg = "#f8f8f2" },
  { url = "*/", fg = "#bd93f9" },
]
